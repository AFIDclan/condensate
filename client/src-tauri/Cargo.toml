[package]
name = "condensate-client"
description = "Condensate desktop client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "condensate_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
condensate-core.workspace = true
condensate-sdk.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
futures.workspace = true
rand.workspace = true
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
