[package]
name = "condensate-cli"
description = "The condensate command: log in, publish builds, install/update and launch games"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "condensate"
path = "src/main.rs"

[dependencies]
condensate-core.workspace = true
condensate-sdk.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
